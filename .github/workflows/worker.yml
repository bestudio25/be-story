name: BE STORY · processamento

on:
  repository_dispatch:
    types: [be-story-jobs]        # acionado pelo painel (Gerar site, Sincronizar, ZIP)
  schedule:
    - cron: "*/15 * * * *"        # rede de segurança: verifica a fila a cada 15 min
  workflow_dispatch: {}

concurrency:
  group: be-story-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # 4 máquinas em paralelo dividem a fila (cada uma pega o próximo item livre); as que não acham trabalho encerram logo
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Verificar se há trabalho na fila
        id: queue
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          sudo apt-get install -y -qq postgresql-client >/dev/null
          N=$(psql "$DATABASE_URL" -tAc "select (select count(*) from jobs where (status='pendente' and run_after <= now())
                 or (status='processando' and updated_at < now() - interval '90 minutes'))
                 + (select count(*) from events where status='ativo' and expires_at < now())" || echo 1)
          echo "pending=$N" >> "$GITHUB_OUTPUT"
          echo "Itens na fila: $N"

      - uses: actions/checkout@v4
        if: steps.queue.outputs.pending != '0'

      - uses: actions/setup-node@v4
        if: steps.queue.outputs.pending != '0'
        with:
          node-version: 22
          cache: npm

      - name: Instalar ffmpeg, exiftool e libheif
        if: steps.queue.outputs.pending != '0'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libimage-exiftool-perl libheif-examples >/dev/null

      - name: Instalar dependências
        if: steps.queue.outputs.pending != '0'
        run: npm ci --no-audit --no-fund

      - name: Atualizar banco (idempotente)
        if: steps.queue.outputs.pending != '0'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate

      - name: Processar fila
        if: steps.queue.outputs.pending != '0'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: b0e34e2cf7d2c5071f46f78a20a553c0
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: be-story-media
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          NEXT_PUBLIC_SITE_URL: https://memorias.bestudiomkt.com.br
          WORKER_CONCURRENCY: "2"
          WORKER_MAX_MINUTES: "330"
        run: npm run worker
